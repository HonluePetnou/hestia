services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hestia-db
    environment:
      POSTGRES_USER: hestia
      POSTGRES_PASSWORD: hestia
      POSTGRES_DB: hestia
    ports:
      # Host port 5434 avoids clashing with a locally installed PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - hestia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hestia -d hestia"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  hestia-pgdata:
